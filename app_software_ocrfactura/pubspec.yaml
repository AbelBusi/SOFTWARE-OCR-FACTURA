version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image: ^4.2.0
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
